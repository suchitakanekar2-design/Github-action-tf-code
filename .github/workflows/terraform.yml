
# This is a basic workflow for terraform 
name: terraform CI
on:
  push:
    branches:
      - github-action

  pull_request:
    branches:
      - github-action

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Account
        run: az account show

      - name: Check Terraform Version
        run: terraform version

      - name: Terraform Init
        working-directory: Environment/Dev
        run: terraform init

      - name: Terraform validate
        working-directory: Environment/Dev
        run: terraform validate

      - name: terraform fmt
        working-directory: Environment/Dev
        run: terraform fmt

      - name: terraform plan
        working-directory: Environment/Dev
        run: terraform plan
   
     
     


